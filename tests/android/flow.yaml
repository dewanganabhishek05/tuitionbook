# Main flows on a real Android build (emulator, airplane mode). Run by tests/android/run-e2e.sh.
appId: com.tuitionbook.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Add your first student"
    timeout: 90000
- takeScreenshot: 01-first-launch

# Sample data
- tapOn: "Try with sample data"
- extendedWaitUntil:
    visible: ".*/18 paid"
    timeout: 120000
- takeScreenshot: 02-today

# Attendance for everyone: mark all absent, save, parents sheet, Today card
- tapOn: "Take attendance"
- extendedWaitUntil:
    visible: "Save attendance"
    timeout: 20000
- tapOn: "All absent"
- takeScreenshot: 03-roll-call
- tapOn: "Save attendance"
- extendedWaitUntil:
    visible: "Tell parents?"
    timeout: 20000
- takeScreenshot: 04-tell-parents
- tapOn: "Done"
- extendedWaitUntil:
    visible: "0/18 present"
    timeout: 20000

# Calendar: month grid, then open the sample holiday from the list
- tapOn: "Calendar"
- extendedWaitUntil:
    visible: "Days taken"
    timeout: 20000
- takeScreenshot: 05-calendar
- scrollUntilVisible:
    element: "Festival holiday"
    direction: DOWN
- tapOn: "Festival holiday"
- extendedWaitUntil:
    visible: "Remove holiday"
    timeout: 20000
- takeScreenshot: 06-day-holiday
- back

# Fees: record a payment for a pending student
- tapOn: "Fees"
- extendedWaitUntil:
    visible: "Pending · \\d+"
    timeout: 20000
- takeScreenshot: 07-fees
- tapOn: "Diya Patel"
- extendedWaitUntil:
    visible: "Balance due"
    timeout: 20000
- tapOn: "Record ₹.*"
- extendedWaitUntil:
    visible: "Payment recorded"
    timeout: 20000
- takeScreenshot: 08-payment-recorded
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Pending · \\d+"
    timeout: 20000
- assertNotVisible: "Diya Patel"

# Students: list and search
- tapOn: "Students"
- extendedWaitUntil:
    visible: "18 shown"
    timeout: 20000
- tapOn: "Search name, phone or class"
- inputText: "Aarav"
- extendedWaitUntil:
    visible: "1 shown"
    timeout: 10000
- hideKeyboard
- tapOn: "Aarav Sharma"
- extendedWaitUntil:
    visible: "Fee outstanding"
    timeout: 20000
- takeScreenshot: 09-student
- back

# Notes Check: open a subject, a student, tick a chapter (30 by default)
- tapOn: "More"
- tapOn: "Notes Check"
- extendedWaitUntil:
    visible: "Maths"
    timeout: 20000
- tapOn: "Maths"
- extendedWaitUntil:
    visible: "Aarav Sharma"
    timeout: 20000
- tapOn: "Aarav Sharma"
- extendedWaitUntil:
    visible: "Tap a chapter to tick it"
    timeout: 20000
- assertVisible: "Chapter 30"
- takeScreenshot: 14-notes-grid
- back
# Mark a chapter for all students
- tapOn: "Mark chapters for all students"
- extendedWaitUntil:
    visible: "All students"
    timeout: 20000
- tapOn: "Chapter 12 for all students"
- takeScreenshot: 15-notes-all
- back
- back

# Add a subject: the sheet must sit above the keyboard
- tapOn: "Subject"
- extendedWaitUntil:
    visible: "Number of chapters"
    timeout: 20000
- tapOn: "e.g. Maths"
- inputText: "Hindi"
- takeScreenshot: 16-subject-sheet-keyboard
- hideKeyboard
- tapOn:
    text: "Add subject"
    index: 1
- extendedWaitUntil:
    visible: "Hindi"
    timeout: 20000
- back

# Reports: PDF and Excel each open the share sheet
- tapOn: "More"
- tapOn: "Attendance, Notes Check.*"
- extendedWaitUntil:
    visible: "Download as PDF or Excel"
    timeout: 20000
- takeScreenshot: 17-reports
- tapOn: "Excel"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: 18-share-excel
- back
- assertVisible: "Attendance report"
- tapOn: "PDF"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 19-share-pdf
- back
- assertVisible: "Attendance report"
- back

# Backup screen shows the Google connect button on a real device
- tapOn: "More"
- tapOn: "Backup & restore"
- extendedWaitUntil:
    visible: "Connect Google account"
    timeout: 30000
- takeScreenshot: 10-backup
- back

# Data survives an app restart (on-device SQLite)
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".*/18 paid"
    timeout: 60000
- assertVisible: "0/18 present"
- takeScreenshot: 11-after-restart
