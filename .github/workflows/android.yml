# Builds an unsigned release APK on every push to main (or on demand), runs the data tests first,
# and publishes the APK to the `apk-builds` branch. Sign it with your own keystore
# (see README → "Sign the APK"): the signing key is never stored on GitHub.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and data tests
        shell: bash
        run: |
          mkdir -p /tmp/logs
          set -o pipefail
          { npx tsc --noEmit && npx eslint src && npm test; } 2>&1 | tee /tmp/logs/checks.log

      - name: Generate the Android project
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure release build (unsigned, split per CPU)
        run: |
          node -e "
            const fs = require('fs');
            const f = 'android/app/build.gradle';
            let s = fs.readFileSync(f, 'utf8');
            const i = s.indexOf('release {', s.indexOf('buildTypes'));
            const j = s.indexOf('signingConfig signingConfigs.debug', i);
            if (i < 0 || j < 0) throw new Error('release signing line not found');
            s = s.slice(0, j) + '// unsigned: signed later with the owner\'s keystore' + s.slice(j + 'signingConfig signingConfigs.debug'.length);
            // One APK per CPU type (smaller downloads) plus a universal one.
            s = s.replace(/android \{\n/, \"android {\n    splits { abi { enable true; reset(); include 'armeabi-v7a', 'arm64-v8a', 'x86_64'; universalApk true } }\n\");
            if (!s.includes('splits { abi')) throw new Error('splits not added');
            fs.writeFileSync(f, s);
          "
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64/' android/gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          printf "\norg.gradle.parallel=true\norg.gradle.caching=true\n" >> android/gradle.properties
          grep -nE "reactNativeArchitectures|jvmargs|parallel|caching" android/gradle.properties

      - name: Build release APK
        id: build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/logs && touch /tmp/logs/gradle.log
          # Heartbeat: publish the latest log lines every 8 minutes to the build-progress branch.
          (
            mkdir -p /tmp/prog && cd /tmp/prog && git init -q -b build-progress
            git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
            while sleep 480; do
              tail -n 80 /tmp/logs/gradle.log > progress.log
              git add -A && git commit -qm "progress $(date -u +%T)" && \
                git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-progress
            done
          ) >/dev/null 2>&1 &
          START=$(date +%s)
          ./gradlew assembleRelease --no-daemon --stacktrace --parallel 2>&1 | while IFS= read -r line; do printf '[%4ds] %s\n' $(( $(date +%s) - START )) "$line"; done | tee /tmp/logs/gradle.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuitionbook-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to apk-builds branch
        run: |
          mkdir -p /tmp/out
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release-unsigned\.apk$/\1/')
            cp "$f" "/tmp/out/tuitionbook-${abi}-unsigned.apk"
          done
          ls -la /tmp/out
          cd /tmp/out
          printf "commit=%s\nbuilt=%s\nrun=%s\n" "$GITHUB_SHA" "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" > BUILD_INFO.txt
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "APK for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds

      - name: Report failure details
        if: failure() || cancelled()
        run: |
          mkdir -p /tmp/fail && cd /tmp/fail
          echo "Build failed in run $GITHUB_RUN_ID at $(date -u +%FT%TZ) for $GITHUB_SHA" > BUILD_FAILED.txt
          for f in /tmp/logs/*.log; do [ -f "$f" ] && tail -n 400 "$f" > "$(basename "$f")"; done
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Build failed for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds || true

  android-e2e:
    name: Emulator test (Maestro)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tuitionbook-unsigned-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Sign the x86_64 APK with a throwaway CI key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore /tmp/ci.jks -alias ci -keyalg RSA -keysize 2048 -validity 2 \
            -storepass cipass -keypass cipass -dname "CN=CI"
          "$BT/zipalign" -f 4 apk/app-x86_64-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/ci.jks --ks-pass pass:cipass --key-pass pass:cipass --out /tmp/app.apk /tmp/aligned.apk

      - name: Run flows on an Android 14 emulator (airplane mode)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tests/android/run-e2e.sh /tmp/app.apk

      - name: Publish results to e2e-results branch
        if: always()
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          printf "commit=%s\nrun=%s\noutcome=%s\n" "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ job.status }}" > RUN_INFO.txt
          git init -q -b e2e-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "E2E results for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" e2e-results
